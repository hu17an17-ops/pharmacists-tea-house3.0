    ></div>

  <section>


    <h2 class="section-title">
      戰豆奶茶

<button

  class="cart-button"
  aria-label="查看訂單"

  <span class="cart-icon">
    🛒
  </span>


  <b id="cartCount">

  </b>

  </span>


</button>

    >
      ×
    </button>



    <h2>
      確認訂單

    <div id="cartItems"></div>



    <div class="total">


      <span>
        合計
      </span>


      <strong id="cartTotal">
        $0
      </strong>


    </div>



    <form id="orderForm">


      <!-- 姓名 -->

      <label>

        姓名


        <input
          name="name"
          required
          maxlength="50"
          placeholder="請輸入姓名"
        >

      </label>



      <!-- 電話 -->

      <label>

        電話


        <input
          name="phone"
          required
          maxlength="30"
          inputmode="tel"
          placeholder="請輸入手機或電話"
        >

      </label>



      <!-- 取餐時間 -->

      <label>

        取餐時間


        <select
          id="pickupDateTime"
          name="pickupDateTime"
          required
        >
          <option value="">請選擇取餐時間</option>
        </select>

      </label>



      <!-- 取餐時間說明 -->

      <div
        style="
          margin:-4px 0 12px;
          padding:10px 12px;
          background:#fff8ef;
          border:1px solid #ead8c6;
          border-radius:10px;
          color:#7a675b;
          font-size:14px;
          line-height:1.6;
        "
      >

        溫馨提醒：線上預訂會直接開立發票，如訂購杯數較多，製作時間較長，
        請提前訂購或來電詢問，謝謝。
        

      </div>



      <!-- 購物袋 -->

      <label>
        購物袋
      </label>



      <div class="bag-option">


        <span>

          1 杯袋

          <small>
            $1／個
          </small>

        </span>


        <button
          type="button"
          onclick="changeBag('bag1',-1)"
        >
          −
        </button>


        <span id="bag1Count">
          0
        </span>


        <button
          type="button"
          onclick="changeBag('bag1',1)"
        >
          ＋
        </button>


      </div>



      <div class="bag-option">


        <span>

          2～8 杯袋

          <small>
            $2／個
          </small>

        </span>


        <button
          type="button"
          onclick="changeBag('bag2',-1)"
        >
          −
        </button>


        <span id="bag2Count">
          0
        </span>


        <button
          type="button"
          onclick="changeBag('bag2',1)"
        >
          ＋
        </button>


      </div>



      <!-- 備註 -->

      <label>

        備註


        <textarea
          name="note"
          maxlength="300"
          placeholder="例如：統編、其他需求"
        ></textarea>


      </label>



      <!-- 送出 -->

      <button
        class="submit"
        type="submit"
      >
        送出訂單
      </button>


    </form>



    <p class="cash-note">
      送出後請依訂單編號到店取餐，現場付款。
    </p>



    <!--
      ==========================================================
      訂單結果
      ==========================================================
      這裡保留原本的 result。
      app.js 原本的訂單結果會繼續顯示在這裡。
    -->

    <div id="result"></div>



    <!--
      ==========================================================
      新增：訂單截圖／保存提醒
      ==========================================================
      不修改原本訂單結果，
      只在訂單送出後顯示這個提醒。
    -->

    <div
      id="orderSaveReminder"
      style="
        display:none;
        margin-top:20px;
        padding:20px 18px;
        background:#fff7e8;
        border:3px solid #963028;
        border-radius:18px;
        color:#4b3029;
        box-shadow:0 6px 18px rgba(0,0,0,.10);
        text-align:left;
      "
    >

      <div
        style="
          font-size:22px;

          margin-bottom:12px;
          color:#963028;
        "
      >
        📸 請立即截圖或保存此訂單畫面！

          font-size:17px;
          line-height:1.8;
          font-weight:600;
        "

        <strong style="color:#963028;">
           訂單編號
        </strong>。


        <br>


        並依訂單編號到店取餐，
        <strong>
           現場付款。
        </strong>

      </div>


      <div
        style="
          margin-top:14px;
          padding-top:14px;
          border-top:1px solid #dfc9ad;
          font-size:14px;
          line-height:1.6;
          color:#765f55;
        "
      >

        ⚠️ 為避免忘記訂單編號，
        建議現在就將此畫面截圖或保存。

      </div>

    </div>


  </div>


</dialog>



<div
  id="toast"
  class="toast"
></div>



<!--
  ============================================================
  取餐時間自動選擇功能
  ============================================================

  規則：
  1. 客人不能自行輸入取餐時間。
  2. 以當下時間往後至少 15 分鐘開始。
  3. 每 5 分鐘提供一個時段。
  4. 提供未來 2 小時的選擇。
  5. 每分鐘自動重新整理時間。
  6. 開啟確認訂單時重新整理。
  7. 送出訂單前再次重新整理。
  ============================================================
-->

<script>

(function () {

  const pickupSelect =
    document.getElementById("pickupDateTime");


  if (!pickupSelect) {
    return;
  }


  function pad(n) {

    return String(n).padStart(2, "0");

  }


  function updatePickupTimes() {

    const now = new Date();


    /*
      往後 15 分鐘。

      例如：
      現在 14:17
      +15 分鐘 = 14:32

      再往上取到下一個 5 分鐘時段
      → 14:35
    */

    const first =
      new Date(
        now.getTime() +
        15 * 60 * 1000
      );


    first.setSeconds(0, 0);


    const remainder =
      first.getMinutes() % 5;


    if (remainder !== 0) {

      first.setMinutes(
        first.getMinutes() +
        (5 - remainder)
      );

    }


    /*
      如果客人已經選過時間，
      更新選項後盡量保留原本選擇。
    */

    const currentValue =
      pickupSelect.value;


    pickupSelect.innerHTML =
      '<option value="">請選擇取餐時間</option>';


    /*
      提供未來 2 小時的時段。
      每 5 分鐘一個選項。
    */

    for (
      let i = 0;
      i < 24;
      i++
    ) {

      const time =
        new Date(
          first.getTime() +
          i * 5 * 60 * 1000
        );


      const month =
        time.getMonth() + 1;


      const day =
        time.getDate();


      const hours =
        time.getHours();


      const minutes =
        time.getMinutes();


      const value =
        `${month}/${day} ${pad(hours)}:${pad(minutes)}`;


      const option =
        document.createElement("option");


      option.value =
        value;


      option.textContent =
        value;


      pickupSelect.appendChild(
        option
      );

    }


    /*
      如果原本選擇的時間仍然存在，
      就保留原本的選擇。
    */

    if (currentValue) {

      const exists =
        Array.from(
          pickupSelect.options
        ).some(
          option =>
            option.value === currentValue
        );


      if (exists) {

        pickupSelect.value =
          currentValue;

      }

    }

  }


  /*
    頁面載入時先產生一次。
  */

  updatePickupTimes();


  /*
    每分鐘更新一次，
    避免客人停留太久後選到過期時間。
  */

  setInterval(
    updatePickupTimes,
    60 * 1000
  );


  /*
    客人按下「查看訂單」時，
    再重新計算一次。
  */

  document.addEventListener(
    "click",
    function (event) {

      if (
        event.target.closest(
          "#cartButton"
        )
      ) {

        updatePickupTimes();

      }

    }
  );


  /*
    送出訂單前，
    再重新整理一次時間。
  */

  const form =
    document.getElementById(
      "orderForm"
    );


  if (form) {

    form.addEventListener(
      "submit",
      function () {

        updatePickupTimes();

      },
      true
    );

  }


})();

</script>



<script src="/app.js"></script>



<!--
  ============================================================
  新增功能：
  監看原本的 #result

  app.js 送出訂單後，只要 #result 裡面出現訂單結果，
  就會自動顯示「請截圖或保存」提醒。

  不會修改原本的訂單內容。
  不會修改商品。
  不會修改購物車。
  不會修改送單流程。
  ============================================================
-->

<script>

(function () {

  const result =
    document.getElementById("result");


  const reminder =
    document.getElementById(
      "orderSaveReminder"
    );


  if (
    !result ||
    !reminder
  ) {

    return;

  }


  function checkOrderResult() {

    const text =
      (
        result.innerText ||
        ""
      ).trim();


    const html =
      (
        result.innerHTML ||
        ""
      ).trim();


    /*
      只要原本的 result 有訂單內容，
      就顯示提醒。

      使用多個關鍵字判斷，
      避免頁面一開始就顯示。
    */

    const hasOrder =
      text.length > 0 &&
      (
        text.includes("訂單") ||
        text.includes("取餐") ||
        text.includes("合計") ||
        html.length > 20
      );


    if (hasOrder) {

      reminder.style.display =
        "block";

    } else {

      reminder.style.display =
        "none";

    }

  }


  /*
    監看 app.js 是否更新 #result
  */

  const observer =
    new MutationObserver(
      function () {

        checkOrderResult();

      }
    );


  observer.observe(
    result,
    {
      childList: true,
      subtree: true,
      characterData: true
    }
  );


  /*
    初始檢查
  */

  checkOrderResult();


})();

</script>


</body>
</html>
