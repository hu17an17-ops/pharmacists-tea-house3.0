<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>點茶｜線上點餐</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       頁首
       ===================================================== */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(
        255,
        255,
        255,
        0.96
      );

      border-bottom:
        1px solid #e8e8e8;

      backdrop-filter:
        blur(12px);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;

      min-height: 64px;

      padding:
        0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .brand {
      color: #222;
      text-decoration: none;

      font-size: 20px;
      font-weight: 800;

      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .line-status {
      border: 0;
      border-radius: 999px;

      padding:
        8px 12px;

      background: #06c755;
      color: #fff;

      font-size: 13px;
      font-weight: 700;
    }

    .line-status.unbound {
      background: #f1f1f1;
      color: #555;
    }

    /* =====================================================
       主要內容
       ===================================================== */

    main {
      max-width: 1100px;
      margin: 0 auto;

      padding:
        24px 18px 110px;
    }

    .page-title {
      margin:
        8px 0 20px;

      font-size: 30px;
      line-height: 1.25;
      font-weight: 800;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      margin:
        0 0 12px;

      font-size: 21px;
      font-weight: 800;
    }

    /* =====================================================
       LINE 綁定首頁／品牌 Gate
       ===================================================== */

    body.gate-mode {
      background: #f5efe3;
    }

    body.gate-mode .site-header {
      display: none;
    }

    body.gate-mode main {
      max-width: 860px;
      padding: 0 14px 48px;
    }

    .line-gate {
      min-height: 100vh;
      padding: 0 0 34px;
      margin: 0 auto;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      text-align: center;
    }

    .gate-brand-image {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      border-radius: 0 0 26px 26px;
      object-fit: cover;
    }

    .gate-card {
      width: min(100%, 720px);
      margin: -2px auto 0;
      padding: 22px 22px 26px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(120, 90, 55, 0.14);
      border-radius: 24px;
      box-shadow: 0 12px 34px rgba(92, 67, 35, 0.12);
    }

    .gate-character {
      width: min(100%, 520px);
      margin: 0 auto 10px;
      border-radius: 20px;
    }

    .line-gate-text {
      margin: 8px auto 22px;
      max-width: 600px;
      color: #654a35;
      font-size: 16px;
      line-height: 1.9;
      letter-spacing: 0.02em;
    }

    .line-login-button {
      width: 100%;
      max-width: 600px;
      min-height: 60px;
      border: 0;
      border-radius: 16px;
      background: #b51f25;
      color: #fff;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 20px rgba(181, 31, 37, 0.22);
    }

    .line-login-button:hover {
      background: #9f191f;
    }

    .line-login-button:active {
      transform: translateY(1px);
    }

    @media (max-width: 600px) {
      body.gate-mode main {
        padding: 0 10px 28px;
      }

      .gate-brand-image {
        border-radius: 0 0 18px 18px;
      }

      .gate-card {
        padding: 12px 10px 18px;
        border-radius: 20px;
      }

      .gate-character {
        margin-bottom: 4px;
        border-radius: 14px;
      }

      .line-gate-text {
        font-size: 15px;
        line-height: 1.75;
        margin-bottom: 16px;
      }

      .line-login-button {
        min-height: 56px;
        font-size: 18px;
        border-radius: 14px;
      }
    }

    .line-bound-box {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 14px 16px;

      border-radius: 12px;

      background: #f4fff7;
      border:
        1px solid #ccefd7;
    }

    .line-bound-info {
      min-width: 0;
    }

    .line-bound-label {
      color: #16833d;

      font-size: 13px;
      font-weight: 700;
    }

    .line-bound-name {
      margin-top: 3px;

      font-size: 16px;
      font-weight: 800;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .line-unbind-button {
      flex: 0 0 auto;

      border:
        1px solid #ddd;

      border-radius: 8px;

      padding:
        8px 10px;

      background: #fff;
      color: #555;

      font-size: 13px;
    }

    /* =====================================================
       客人資料
       ===================================================== */

    .customer-card {
      background: #fff;

      border:
        1px solid #e6e6e6;

      border-radius: 16px;

      padding: 18px;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    .form-group.full {
      grid-column:
        1 / -1;
    }

    .form-label {
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: #d33;
      margin-left: 3px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;

      border:
        1px solid #d9d9d9;

      border-radius: 10px;

      background: #fff;

      padding:
        11px 12px;

      color: #222;

      outline: none;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: #888;

      box-shadow:
        0 0 0 3px
        rgba(
          0,
          0,
          0,
          0.05
        );
    }

    .form-textarea {
      min-height: 90px;
      resize: vertical;
    }

    .phone-note {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    /* =====================================================
       菜單
       ===================================================== */

    .menu-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;
    }

    .menu-item {
      background: #fff;

      border:
        1px solid #e6e6e6;

      border-radius: 16px;

      padding: 16px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .menu-item-name {
      font-size: 18px;
      font-weight: 800;
    }

    .menu-item-desc {
      color: #777;

      font-size: 13px;
      line-height: 1.55;
    }

    .menu-item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .menu-price {
      font-size: 18px;
      font-weight: 800;
    }

    .quantity-control {
      display: flex;
      align-items: center;

      border:
        1px solid #ddd;

      border-radius: 10px;

      overflow: hidden;
    }

    .quantity-button {
      width: 38px;
      height: 38px;

      border: 0;

      background: #f5f5f5;
      color: #222;

      font-size: 20px;
    }

    .quantity-value {
      width: 38px;

      text-align: center;

      font-size: 15px;
      font-weight: 700;
    }

    /* =====================================================
       商品客製
       ===================================================== */

    .custom-options {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;
    }

    .option-group {
      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    .option-label {
      color: #666;

      font-size: 12px;
      font-weight: 700;
    }

    /* =====================================================
       購物袋
       ===================================================== */

    .bag-card {
      background: #fff;

      border:
        1px solid #e6e6e6;

      border-radius: 16px;

      padding: 18px;
    }

    .bag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 14px;

      padding:
        10px 0;

      border-bottom:
        1px solid #eee;
    }

    .bag-row:last-child {
      border-bottom: 0;
    }

    .bag-name {
      font-weight: 700;
    }

    .bag-price {
      color: #777;
      font-size: 13px;
    }

    /* =====================================================
       訂單摘要
       ===================================================== */

    .summary-card {
      background: #fff;

      border:
        1px solid #e6e6e6;

      border-radius: 16px;

      padding: 18px;
    }

    .summary-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;

      padding:
        8px 0;
    }

    .summary-label {
      color: #666;
    }

    .summary-value {
      text-align: right;
      font-weight: 700;
    }

    .summary-total {
      margin-top: 10px;
      padding-top: 14px;

      border-top:
        1px solid #ddd;

      font-size: 20px;
      font-weight: 800;
    }

    /* =====================================================
       底部下單列
       ===================================================== */

    .bottom-bar {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 90;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      border-top:
        1px solid #ddd;

      box-shadow:
        0 -5px 20px
        rgba(
          0,
          0,
          0,
          0.06
        );
    }

    .bottom-inner {
      max-width: 1100px;

      margin: 0 auto;

      padding:
        10px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .cart-total {
      min-width: 0;
    }

    .cart-label {
      color: #777;
      font-size: 12px;
    }

    .cart-price {
      font-size: 21px;
      font-weight: 900;
    }

    .submit-button {
      min-width: 150px;
      min-height: 48px;

      border: 0;
      border-radius: 12px;

      background: #222;
      color: #fff;

      font-size: 16px;
      font-weight: 800;
    }

    .submit-button:disabled {
      background: #ccc;
      color: #fff;

      cursor: not-allowed;
    }

    /* =====================================================
       Toast
       ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 90px;

      z-index: 300;

      transform:
        translateX(-50%)
        translateY(20px);

      opacity: 0;

      pointer-events: none;

      max-width:
        calc(
          100vw - 32px
        );

      padding:
        11px 15px;

      border-radius: 10px;

      background: #222;
      color: #fff;

      font-size: 14px;
      line-height: 1.5;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =====================================================
       Modal
       ===================================================== */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      z-index: 200;

      background:
        rgba(
          0,
          0,
          0,
          0.45
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;
    }

    .modal {
      width: 100%;
      max-width: 460px;

      background: #fff;

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.2
        );
    }

    .modal-title {
      margin: 0 0 8px;

      font-size: 21px;
      font-weight: 800;
    }

    .modal-text {
      margin: 0 0 18px;

      color: #666;

      line-height: 1.7;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-button {
      flex: 1;

      min-height: 46px;

      border-radius: 10px;

      font-weight: 800;
    }

    .modal-button.primary {
      border: 0;

      background: #06c755;
      color: #fff;
    }

    .modal-button.secondary {
      border:
        1px solid #ddd;

      background: #fff;
      color: #333;
    }

    /* =====================================================
       手機版
       ===================================================== */

    @media (
      max-width: 700px
    ) {

      main {
        padding:
          18px 12px 105px;
      }

      .header-inner {
        padding:
          0 12px;
      }

      .page-title {
        font-size: 26px;
      }

      .form-grid {
        grid-template-columns:
          1fr;
      }

      .form-group.full {
        grid-column:
          auto;
      }

      .menu-grid {
        grid-template-columns:
          1fr;
      }

      .custom-options {
        grid-template-columns:
          1fr;
      }

      .bottom-inner {
        padding:
          9px 12px;
      }

      .submit-button {
        min-width: 130px;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       Header
       ===================================================== -->

  <header class="site-header">

    <div class="header-inner">

      <a
        href="/"
        class="brand"
      >
        點茶
      </a>

      <div
        class="header-right"
      >

        <button
          id="lineStatusButton"
          class="line-status unbound"
          type="button"
        >
          LINE
        </button>

      </div>

    </div>

  </header>


  <!-- =====================================================
       Main
       ===================================================== -->

  <main>

    <h1 class="page-title hidden">
      現在點餐
    </h1>


    <!-- ===================================================
         LINE Gate：客人剛進入網站時的品牌首頁
         =================================================== -->

    <section
      id="lineGate"
      class="section"
    >

      <div class="line-gate">

        <img
          class="gate-brand-image"
          src="/assets/tea-header.webp"
          alt="藥師的私房紅茶｜線上預訂"
        >

        <div class="gate-card">

          <img
            class="gate-character"
            src="/assets/pharmacist.webp"
            alt="藥師的私房紅茶角色"
          >

          <p
            class="line-gate-text"
          >
            為了讓我們可以確認您的訂單，並在需要時聯絡您，<br>
            點餐前需要先連結 LINE。
          </p>

          <button
            id="lineLoginButton"
            class="line-login-button"
            type="button"
          >
            連結 LINE 開始點餐
          </button>

        </div>

      </div>

    </section>


    <!-- ===================================================
         點餐內容
         綁定 LINE 後才顯示
         =================================================== -->

    <div
      id="orderArea"
      class="hidden"
    >


      <!-- ================================================
           LINE 狀態
           ================================================ -->

      <section
        class="section"
      >

        <div
          id="lineBoundBox"
          class="line-bound-box"
        >

          <div
            class="line-bound-info"
          >

            <div
              class="line-bound-label"
            >
              LINE 已連結
            </div>

            <div
              id="lineBoundName"
              class="line-bound-name"
            >
              已連結
            </div>

          </div>

          <button
            id="lineLogoutButton"
            class="line-unbind-button"
            type="button"
          >
            登出
          </button>

        </div>

      </section>


      <!-- ================================================
           客人資料
           ================================================ -->

      <section
        class="section"
      >

        <h2
          class="section-title"
        >
          聯絡資料
        </h2>

        <div
          class="customer-card"
        >

          <div
            class="form-grid"
          >

            <div
              class="form-group"
            >

              <label
                class="form-label"
                for="customerName"
              >
                姓名
                <span
                  class="required"
                >
                  *
                </span>
              </label>

              <input
                id="customerName"
                class="form-input"
                type="text"
                autocomplete="name"
                maxlength="100"
                placeholder="請輸入姓名"
              >

            </div>


            <div
              class="form-group"
            >

              <label
                class="form-label"
                for="customerPhone"
              >
                電話
                <span
                  class="required"
                >
                  *
                </span>
              </label>

              <input
                id="customerPhone"
                class="form-input"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                maxlength="50"
                placeholder="請輸入聯絡電話"
              >

              <div
                class="phone-note"
              >
                方便店家確認訂單或聯絡您。
              </div>

            </div>


            <div
              class="form-group"
            >

              <label
                class="form-label"
                for="pickupDate"
              >
                取餐日期
                <span
                  class="required"
                >
                  *
                </span>
              </label>

              <input
                id="pickupDate"
                class="form-input"
                type="date"
              >

            </div>


            <div
              class="form-group"
            >

              <label
                class="form-label"
                for="pickupTime"
              >
                取餐時間
                <span
                  class="required"
                >
                  *
                </span>
              </label>

              <select
                id="pickupTime"
                class="form-select"
              >
                <option value="">
                  請選擇取餐時間
                </option>
              </select>

            </div>


            <div
              class="form-group"
            >

              <label
                class="form-label"
                for="invoiceNumber"
              >
                統一編號
              </label>

              <input
                id="invoiceNumber"
                class="form-input"
                type="text"
                inputmode="numeric"
                maxlength="30"
                placeholder="選填"
              >

            </div>


            <div
              class="form-group full"
            >

              <label
                class="form-label"
                for="orderNote"
              >
                備註
              </label>

              <textarea
                id="orderNote"
                class="form-textarea"
                maxlength="1000"
                placeholder="有其他需求可以寫在這裡"
              ></textarea>

            </div>

          </div>

        </div>

      </section>


      <!-- ================================================
           菜單開始
           ================================================ -->

      <section
        class="section"
      >

        <h2
          class="section-title"
        >
          飲品
        </h2>

        <div
          id="menuGrid"
          class="menu-grid"
        >

          <!-- 商品由 JavaScript 建立 -->

        </div>

      </section>


      <!-- ================================================
           購物袋
           ================================================ -->

      <section
        class="section"
      >

        <h2
          class="section-title"
        >
          購物袋
        </h2>

        <div
          class="bag-card"
        >

          <div
            class="bag-row"
          >

            <div>
              <div class="bag-name">
                1 杯袋
              </div>

              <div class="bag-price">
                每個 $1
              </div>
            </div>

            <div
              class="quantity-control"
            >

              <button
                id="bag1Minus"
                class="quantity-button"
                type="button"
              >
                −
              </button>

              <div
                id="bag1Value"
                class="quantity-value"
              >
                0
              </div>

              <button
                id="bag1Plus"
                class="quantity-button"
                type="button"
              >
                ＋
              </button>

            </div>

          </div>


          <div
            class="bag-row"
          >

            <div>
              <div class="bag-name">
                2～8 杯袋
              </div>

              <div class="bag-price">
                每個 $2
              </div>
            </div>

            <div
              class="quantity-control"
            >

              <button
                id="bag2Minus"
                class="quantity-button"
                type="button"
              >
                −
              </button>

              <div
                id="bag2Value"
                class="quantity-value"
              >
                0
              </div>

              <button
                id="bag2Plus"
                class="quantity-button"
                type="button"
              >
                ＋
              </button>

            </div>

          </div>

        </div>

      </section>


      <!-- ================================================
           訂單摘要
           ================================================ -->

      <section
        class="section"
      >

        <h2
          class="section-title"
        >
          訂單確認
        </h2>

        <div
          id="summaryCard"
          class="summary-card"
        >

          <div
            id="summaryItems"
          >
            尚未選擇商品
          </div>

          <div
            class="summary-row"
          >

            <div
              class="summary-label"
            >
              飲品小計
            </div>

            <div
              id="summaryDrinkTotal"
              class="summary-value"
            >
              $0
            </div>

          </div>

          <div
            class="summary-row"
          >

            <div
              class="summary-label"
            >
              購物袋
            </div>

            <div
              id="summaryBagTotal"
              class="summary-value"
            >
              $0
            </div>

          </div>

          <div
            class="summary-row summary-total"
          >

            <div>
              總計
            </div>

            <div
              id="summaryTotal"
            >
              $0
            </div>

          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       Bottom Bar
       ===================================================== -->

  <div
    id="bottomBar"
    class="bottom-bar hidden"
  >

    <div
      class="bottom-inner"
    >

      <div
        class="cart-total"
      >

        <div
          class="cart-label"
        >
          訂單總額
        </div>

        <div
          id="bottomTotal"
          class="cart-price"
        >
          $0
        </div>

      </div>

      <button
        id="submitOrderButton"
        class="submit-button"
        type="button"
        disabled
      >
        送出訂單
      </button>

    </div>

  </div>


  <!-- =====================================================
       Toast
       ===================================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       LINE 必須綁定提示 Modal
       ===================================================== -->

  <div
    id="lineRequiredModal"
    class="modal-backdrop hidden"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lineModalTitle"
    >

      <h2
        id="lineModalTitle"
        class="modal-title"
      >
        請先連結 LINE
      </h2>

      <p
        class="modal-text"
      >
        為了確認您的訂單，
        需要先連結 LINE。
        完成後就可以繼續點餐。
      </p>

      <div
        class="modal-actions"
      >

        <button
          id="lineModalCancel"
          class="modal-button secondary"
          type="button"
        >
          先不要
        </button>

        <button
          id="lineModalLogin"
          class="modal-button primary"
          type="button"
        >
          連結 LINE
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       訂單送出成功 Modal
       ===================================================== -->

  <div
    id="successModal"
    class="modal-backdrop hidden"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
    >

      <h2
        class="modal-title"
      >
        訂單已送出
      </h2>

      <p
        id="successText"
        class="modal-text"
      >
        感謝您的訂購。
      </p>

      <div
        class="modal-actions"
      >

        <button
          id="successClose"
          class="modal-button primary"
          type="button"
        >
          確定
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JavaScript
       ===================================================== -->

  <script>

    /* =====================================================
       基本設定
       ===================================================== */

    const state = {

      lineBound: false,

      lineUserId: "",

      lineDisplayName: "",

      customer: {
        name: "",
        phone: "",
        invoiceNumber: "",
        note: ""
      },

      items: [],

      bag1Count: 0,

      bag2Count: 0,

      submitting: false

    };


    /* =====================================================
       商品資料
       ===================================================== */

    /*
     * 這裡會由後續程式統一建立商品。
     *
     * 商品資料格式：
     *
     * {
     *   id,
     *   name,
     *   price,
     *   desc,
     *   sweetness,
     *   ice,
     *   quantity
     * }
     */

    const MENU = [
    ];

    /* =====================================================
       DOM
       ===================================================== */

    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       Toast
       ===================================================== */

    let toastTimer = null;

    function showToast(
      message
    ) {

      const toast =
        $("toast");

      if (!toast) {
        return;
      }

      toast.textContent =
        String(
          message || ""
        );

      toast.classList.add(
        "show"
      );

      clearTimeout(
        toastTimer
      );

      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2600
        );
    }


    /* =====================================================
       LINE Login
       ===================================================== */

    function goToLineLogin() {

      const returnPath =
        window.location.pathname +
        window.location.search;

      window.location.href =
        "/api/line/login?return=" +
        encodeURIComponent(
          returnPath
        );
    }


    /* =====================================================
       LINE 狀態
       ===================================================== */

    async function loadLineStatus() {

      try {

        const response =
          await fetch(
            "/api/line/status",
            {
              method:
                "GET",

              credentials:
                "include",

              cache:
                "no-store"
            }
          );

        const data =
          await response.json();

        if (
          !response.ok
        ) {

          throw new Error(
            data.message ||
            "無法取得 LINE 狀態"
          );

        }

        state.lineBound =
          Boolean(
            data.bound
          );

        state.lineUserId =
          data.lineUserId ||
          "";

        state.lineDisplayName =
          data.displayName ||
          "";

        if (
          data.name
        ) {
          state.customer.name =
            data.name;
        }

        if (
          data.phone
        ) {
          state.customer.phone =
            data.phone;
        }

        updateLineUI();

        if (
          state.lineBound
        ) {

          await loadLineCustomer();

          showOrderArea();

        } else {

          showLineGate();

        }

      } catch (
        error
      ) {

        console.error(
          "LINE 狀態錯誤:",
          error
        );

        state.lineBound =
          false;

        updateLineUI();

        showLineGate();

      }

    }


    /* =====================================================
       LINE 客人資料
       ===================================================== */

    async function loadLineCustomer() {

      if (
        !state.lineBound
      ) {
        return;
      }

      try {

        const response =
          await fetch(
            "/api/line/me",
            {
              method:
                "GET",

              credentials:
                "include",

              cache:
                "no-store"
            }
          );

        if (
          !response.ok
        ) {
          return;
        }

        const data =
          await response.json();

        const customer =
          data.customer ||
          {};

        state.customer.name =
          customer.name ||
          state.customer.name ||
          "";

        state.customer.phone =
          customer.phone ||
          state.customer.phone ||
          "";

        state.customer.invoiceNumber =
          customer.invoiceNumber ||
          customer.invoice_number ||
          "";

        state.customer.note =
          customer.note ||
          customer.notes ||
          "";

        fillCustomerForm();

      } catch (
        error
      ) {

        console.error(
          "LINE 客戶資料錯誤:",
          error
        );

      }

    }


    /* =====================================================
       更新 LINE UI
       ===================================================== */

    function updateLineUI() {

      const statusButton =
        $("lineStatusButton");

      const boundBox =
        $("lineBoundBox");

      const boundName =
        $("lineBoundName");

      if (
        state.lineBound
      ) {

        if (
          statusButton
        ) {

          statusButton.textContent =
            "LINE 已連結";

          statusButton.classList.remove(
            "unbound"
          );

        }

        if (
          boundBox
        ) {

          boundBox.classList.remove(
            "hidden"
          );

        }

        if (
          boundName
        ) {

          boundName.textContent =
            state.lineDisplayName ||
            "LINE 已連結";

        }

      } else {

        if (
          statusButton
        ) {

          statusButton.textContent =
            "LINE";

          statusButton.classList.add(
            "unbound"
          );

        }

        if (
          boundBox
        ) {

          boundBox.classList.add(
            "hidden"
          );

        }

      }

    }


    /* =====================================================
       顯示 LINE Gate
       ===================================================== */

    function showLineGate() {

      document.body.classList.add(
        "gate-mode"
      );

      const gate =
        $("lineGate");

      const orderArea =
        $("orderArea");

      const bottomBar =
        $("bottomBar");

      if (
        gate
      ) {

        gate.classList.remove(
          "hidden"
        );

      }

      if (
        orderArea
      ) {

        orderArea.classList.add(
          "hidden"
        );

      }

      if (
        bottomBar
      ) {

        bottomBar.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================================
       顯示點餐區
       ===================================================== */

    function showOrderArea() {

      document.body.classList.remove(
        "gate-mode"
      );

      const gate =
        $("lineGate");

      const orderArea =
        $("orderArea");

      const bottomBar =
        $("bottomBar");

      if (
        gate
      ) {

        gate.classList.add(
          "hidden"
        );

      }

      if (
        orderArea
      ) {

        orderArea.classList.remove(
          "hidden"
        );

      }

      if (
        bottomBar
      ) {

        bottomBar.classList.remove(
          "hidden"
        );

      }

      renderMenu();

      updateSummary();

    }


    /* =====================================================
       客人資料表單
       ===================================================== */

    function fillCustomerForm() {

      if (
        $("customerName")
      ) {

        $("customerName").value =
          state.customer.name ||
          "";

      }

      if (
        $("customerPhone")
      ) {

        $("customerPhone").value =
          state.customer.phone ||
          "";

      }

      if (
        $("invoiceNumber")
      ) {

        $("invoiceNumber").value =
          state.customer.invoiceNumber ||
          "";

      }

      if (
        $("orderNote")
      ) {

        $("orderNote").value =
          state.customer.note ||
          "";

      }

    }


    /* =====================================================
       取得表單資料
       ===================================================== */

    function readCustomerForm() {

      state.customer.name =
        String(
          $("customerName")?.value ||
            ""
        ).trim();

      state.customer.phone =
        String(
          $("customerPhone")?.value ||
            ""
        ).trim();

      state.customer.invoiceNumber =
        String(
          $("invoiceNumber")?.value ||
            ""
        ).trim();

      state.customer.note =
        String(
          $("orderNote")?.value ||
            ""
        ).trim();

    }


    /* =====================================================
       驗證 LINE
       ===================================================== */

    function requireLineBinding() {

      if (
        state.lineBound
      ) {

        return true;

      }

      $("lineRequiredModal")
        ?.classList.remove(
          "hidden"
        );

      return false;
    }


    /* =====================================================
       關閉 LINE Modal
       ===================================================== */

    function closeLineModal() {

      $("lineRequiredModal")
        ?.classList.add(
          "hidden"
        );

    }


    /* =====================================================
       商品數量
       ===================================================== */

    function setQuantity(
      itemId,
      quantity
    ) {

      const item =
        state.items.find(
          product =>
            product.id ===
            itemId
        );

      if (!item) {
        return;
      }

      item.quantity =
        Math.max(
          0,
          Math.floor(
            Number(
              quantity
            ) || 0
          )
        );

      updateSummary();

    }


    /* =====================================================
       計算飲品小計
       ===================================================== */

    function getDrinkTotal() {

      return state.items.reduce(
        (
          total,
          item
        ) => {

          return (
            total +
            (
              Number(
                item.price
              ) || 0
            ) *
            (
              Number(
                item.quantity
              ) || 0
            )
          );

        },
        0
      );

    }


    /* =====================================================
       購物袋金額
       ===================================================== */

    function getBagTotal() {

      return (
        state.bag1Count * 1 +
        state.bag2Count * 2
      );

    }


    /* =====================================================
       總金額
       ===================================================== */

    function getTotal() {

      return (
        getDrinkTotal() +
        getBagTotal()
      );

    }


    /* =====================================================
       格式化金額
       ===================================================== */

    function money(
      value
    ) {

      return (
        "$" +
        Number(
          value || 0
        ).toLocaleString(
          "zh-TW"
        )
      );

    }


    /* =====================================================
       HTML Escape
       ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char])
      );

    }


    /* =====================================================
       初始化取餐日期
       ===================================================== */

    function initPickupDate() {

      const input =
        $("pickupDate");

      if (!input) {
        return;
      }

      const now =
        new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );

      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );

      const today =
        `${year}-${month}-${day}`;

      input.min =
        today;

      if (
        !input.value
      ) {

        input.value =
          today;

      }

    }


    /* =====================================================
       取餐時間
       ===================================================== */

    function initPickupTime() {

      const select =
        $("pickupTime");

      if (!select) {
        return;
      }

      const times = [];

      for (
        let hour = 10;
        hour <= 21;
        hour++
      ) {

        for (
          let minute = 0;
          minute < 60;
          minute += 30
        ) {

          if (
            hour === 21 &&
            minute > 0
          ) {
            continue;
          }

          const hh =
            String(
              hour
            ).padStart(
              2,
              "0"
            );

          const mm =
            String(
              minute
            ).padStart(
              2,
              "0"
            );

          times.push(
            `${hh}:${mm}`
          );

        }

      }

      for (
        const time of times
      ) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          time;

        option.textContent =
          time;

        select.appendChild(
          option
        );

      }

    }


    /* =====================================================
       商品畫面
       ===================================================== */

    function renderMenu() {

      const grid =
        $("menuGrid");

      if (!grid) {
        return;
      }

      if (
        !MENU.length
      ) {

        grid.innerHTML =
          `
          <div
            style="
              grid-column:1/-1;
              padding:20px;
              text-align:center;
              color:#777;
            "
          >
            菜單載入中...
          </div>
          `;

        return;
      }

      if (
        !state.items.length
      ) {

        state.items =
          MENU.map(
            item => ({
              ...item,
              quantity:
                0
            })
          );

      }

      grid.innerHTML =
        state.items
          .map(
            item => {

              const quantity =
                Number(
                  item.quantity ||
                    0
                );

              return `
                <article
                  class="menu-item"
                >

                  <div>

                    <div
                      class="menu-item-name"
                    >
                      ${escapeHtml(
                        item.name
                      )}
                    </div>

                    ${
                      item.desc
                        ? `
                          <div
                            class="menu-item-desc"
                          >
                            ${escapeHtml(
                              item.desc
                            )}
                          </div>
                        `
                        : ""
                    }

                  </div>

                  <div
                    class="custom-options"
                  >

                    <div
                      class="option-group"
                    >

                      <label
                        class="option-label"
                      >
                        甜度
                      </label>

                      <select
                        class="form-select item-sweetness"
                        data-id="${escapeHtml(
                          item.id
                        )}"
                      >

                        <option>
                          正常
                        </option>

                        <option>
                          少糖
                        </option>

                        <option>
                          半糖
                        </option>

                        <option>
                          微糖
                        </option>

                        <option>
                          無糖
                        </option>

                      </select>

                    </div>

                    <div
                      class="option-group"
                    >

                      <label
                        class="option-label"
                      >
                        冰塊
                      </label>

                      <select
                        class="form-select item-ice"
                        data-id="${escapeHtml(
                          item.id
                        )}"
                      >

                        <option>
                          正常冰
                        </option>

                        <option>
                          少冰
                        </option>

                        <option>
                          微冰
                        </option>

                        <option>
                          去冰
                        </option>

                      </select>

                    </div>

                  </div>

                  <div
                    class="menu-item-bottom"
                  >

                    <div
                      class="menu-price"
                    >
                      ${money(
                        item.price
                      )}
                    </div>

                    <div
                      class="quantity-control"
                    >

                      <button
                        class="quantity-button item-minus"
                        type="button"
                        data-id="${escapeHtml(
                          item.id
                        )}"
                      >
                        −
                      </button>

                      <div
                        class="quantity-value"
                      >
                        ${quantity}
                      </div>

                      <button
                        class="quantity-button item-plus"
                        type="button"
                        data-id="${escapeHtml(
                          item.id
                        )}"
                      >
                        ＋
                      </button>

                    </div>

                  </div>

                </article>
              `;

            }
          )
          .join("");

    }


    /* =====================================================
       更新摘要
       ===================================================== */

    function updateSummary() {

      const summaryItems =
        $("summaryItems");

      const drinkTotal =
        getDrinkTotal();

      const bagTotal =
        getBagTotal();

      const total =
        getTotal();

      if (
        summaryItems
      ) {

        const selected =
          state.items.filter(
            item =>
              Number(
                item.quantity ||
                  0
              ) > 0
          );

        if (
          !selected.length
        ) {

          summaryItems.innerHTML =
            `
            <div
              style="
                color:#777;
                padding:8px 0;
              "
            >
              尚未選擇商品
            </div>
            `;

        } else {

          summaryItems.innerHTML =
            selected
              .map(
                item => `
                  <div
                    class="summary-row"
                  >

                    <div>
                      ${escapeHtml(
                        item.name
                      )}
                      ×
                      ${Number(
                        item.quantity
                      )}
                    </div>

                    <div
                      class="summary-value"
                    >
                      ${money(
                        Number(
                          item.price
                        ) *
                        Number(
                          item.quantity
                        )
                      )}
                    </div>

                  </div>
                `
              )
              .join("");

        }

      }

      if (
        $("summaryDrinkTotal")
      ) {

        $("summaryDrinkTotal")
          .textContent =
            money(
              drinkTotal
            );

      }

      if (
        $("summaryBagTotal")
      ) {

        $("summaryBagTotal")
          .textContent =
            money(
              bagTotal
            );

      }

      if (
        $("summaryTotal")
      ) {

        $("summaryTotal")
          .textContent =
            money(
              total
            );

      }

      if (
        $("bottomTotal")
      ) {

        $("bottomTotal")
          .textContent =
            money(
              total
            );

      }

      updateSubmitButton();

    }


    /* =====================================================
       送出按鈕狀態
       ===================================================== */

    function updateSubmitButton() {

      const button =
        $("submitOrderButton");

      if (!button) {
        return;
      }

      const itemCount =
        state.items.reduce(
          (
            total,
            item
          ) =>
            total +
            Number(
              item.quantity ||
                0
            ),
          0
        );

      button.disabled =
        state.submitting ||
        !state.lineBound ||
        itemCount <= 0;

    }


    /* =====================================================
       商品操作
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const plus =
          event.target.closest(
            ".item-plus"
          );

        const minus =
          event.target.closest(
            ".item-minus"
          );

        if (
          plus
        ) {

          const id =
            plus.dataset.id;

          const item =
            state.items.find(
              product =>
                String(
                  product.id
                ) ===
                String(id)
            );

          if (item) {

            setQuantity(
              item.id,
              Number(
                item.quantity ||
                  0
              ) + 1
            );

            renderMenu();

          }

          return;

        }

        if (
          minus
        ) {

          const id =
            minus.dataset.id;

          const item =
            state.items.find(
              product =>
                String(
                  product.id
                ) ===
                String(id)
            );

          if (item) {

            setQuantity(
              item.id,
              Math.max(
                0,
                Number(
                  item.quantity ||
                    0
                ) - 1
              )
            );

            renderMenu();

          }

        }

      }
    );


    /* =====================================================
       商品甜度 / 冰塊
       ===================================================== */

    document.addEventListener(
      "change",
      event => {

        const sweetness =
          event.target.closest(
            ".item-sweetness"
          );

        const ice =
          event.target.closest(
            ".item-ice"
          );

        if (
          sweetness
        ) {

          const item =
            state.items.find(
              product =>
                String(
                  product.id
                ) ===
                String(
                  sweetness.dataset.id
                )
            );

          if (item) {

            item.sweetness =
              sweetness.value;

          }

        }

        if (
          ice
        ) {

          const item =
            state.items.find(
              product =>
                String(
                  product.id
                ) ===
                String(
                  ice.dataset.id
                )
            );

          if (item) {

            item.ice =
              ice.value;

          }

        }

      }
    );


    /* =====================================================
       購物袋
       ===================================================== */

    function updateBag(
      type,
      amount
    ) {

      if (
        type === "bag1"
      ) {

        state.bag1Count =
          Math.max(
            0,
            state.bag1Count +
              amount
          );

        $("bag1Value")
          .textContent =
            state.bag1Count;

      }

      if (
        type === "bag2"
      ) {

        state.bag2Count =
          Math.max(
            0,
            state.bag2Count +
              amount
          );

        $("bag2Value")
          .textContent =
            state.bag2Count;

      }

      updateSummary();

    }


    $("bag1Minus")
      ?.addEventListener(
        "click",
        () =>
          updateBag(
            "bag1",
            -1
          )
      );

    $("bag1Plus")
      ?.addEventListener(
        "click",
        () =>
          updateBag(
            "bag1",
            1
          )
      );

    $("bag2Minus")
      ?.addEventListener(
        "click",

<script>
  /* =====================================================
     載入真正菜單
     ===================================================== */

  async function loadMenuFromServer() {

    try {

      const response =
        await fetch(
          "/api/menu",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          "菜單載入失敗"
        );
      }

      const data =
        await response.json();

      const serverMenu =
        Array.isArray(data)
          ? data
          : (
              Array.isArray(data.menu)
                ? data.menu
                : []
            );

      if (serverMenu.length) {

        state.items =
          serverMenu.map(
            (item, index) => ({
              id:
                item.id ??
                item._id ??
                String(index + 1),

              name:
                item.name ??
                item.title ??
                "未命名商品",

              price:
                Number(
                  item.price ?? 0
                ),

              desc:
                item.desc ??
                item.description ??
                "",

              sweetness:
                item.sweetness ??
                "正常",

              ice:
                item.ice ??
                "正常冰",

              quantity:
                Number(
                  item.quantity ?? 0
                )
            })
          );

        renderMenu();
        updateSummary();

      }

    } catch (error) {

      console.error(
        "載入菜單失敗:",
        error
      );

      /*
       * 如果 server 沒有提供 /api/menu，
       * 保留目前頁面邏輯，不讓整個點餐頁崩潰。
       */

      renderMenu();
      updateSummary();

    }

  }


  /* =====================================================
     重新渲染商品後恢復客製選項
     ===================================================== */

  function renderMenuWithValues() {

    renderMenu();

    state.items.forEach(
      item => {

        const sweetness =
          document.querySelector(
            `.item-sweetness[data-id="${CSS.escape(String(item.id))}"]`
          );

        const ice =
          document.querySelector(
            `.item-ice[data-id="${CSS.escape(String(item.id))}"]`
          );

        if (
          sweetness &&
          item.sweetness
        ) {

          sweetness.value =
            item.sweetness;

        }

        if (
          ice &&
          item.ice
        ) {

          ice.value =
            item.ice;

        }

      }
    );

  }


  /* =====================================================
     覆蓋原本 renderMenu 後的重新渲染
     ===================================================== */

  function refreshMenu() {

    renderMenuWithValues();

    updateSummary();

  }


  /* =====================================================
     修改商品數量
     ===================================================== */

  function changeItemQuantity(
    itemId,
    delta
  ) {

    const item =
      state.items.find(
        product =>
          String(product.id) ===
          String(itemId)
      );

    if (!item) {
      return;
    }

    const current =
      Number(
        item.quantity || 0
      );

    item.quantity =
      Math.max(
        0,
        current + Number(delta || 0)
      );

    refreshMenu();

  }

     商品按鈕事件
     ===================================================== */

  document.addEventListener(
    "click",
    event => {

      const plus =
        event.target.closest(
          ".item-plus"
        );

      if (plus) {

        changeItemQuantity(
          plus.dataset.id,
          1
        );

        return;
      }

      const minus =
        event.target.closest(
          ".item-minus"
        );

      if (minus) {

          -1
        );

  /* =====================================================

       */

  /* =====================================================
     送出訂單 API
     ===================================================== */

  async function submitOrder() {

    /*
     * 防止連續點擊
     */

    if (
      state.submitting
    ) {

      return;

    }


    /*
     * 所有驗證先完成
     */

    if (
      !validateOrder()
    ) {

      return;

    }


    const button =
      $("submitOrderButton");

    state.submitting =
      true;

    updateSubmitButton();


    if (button) {

      button.textContent =
        "送出中...";

    }


    const payload =
      buildOrderPayload();


    try {

      /*
       * 再次向 server 確認 LINE 身分。
       *
       * 這一層非常重要：
       * 即使客人修改前端 JavaScript，
       * server 仍然必須自行驗證 LINE。
       */

      const lineCheck =
        await fetch(
          "/api/line/status",
          {
            method: "GET",

            credentials:
              "include",

            cache:
              "no-store"
          }
        );


      if (
        lineCheck.ok
      ) {

        const lineData =
          await lineCheck.json();

        if (
          !lineData.bound
        ) {

          state.lineBound =
            false;

          updateLineUI();

          showLineGate();

          showToast(
            "請先連結 LINE 後再下單"
          );

          return;

        }

        /*
         * 使用 server 最新 LINE ID
         */

        state.lineUserId =
          lineData.lineUserId ||
          state.lineUserId;

        state.lineDisplayName =
          lineData.displayName ||
          state.lineDisplayName;

        payload.lineUserId =
          state.lineUserId;

        payload.lineDisplayName =
          state.lineDisplayName;

      }


      /*
       * 真正建立訂單
       */

      const response =
        await fetch(
          "/api/orders",
          {
            method: "POST",

            credentials:
              "include",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      let data = {};

      try {

        data =
          await response.json();

      } catch (
        parseError
      ) {

        data = {};

      }


      if (
        !response.ok
      ) {

        /*
         * 如果 server 回覆
         * LINE 尚未綁定，
         * 自動重新要求 LINE。
         */

        if (
          response.status === 401 ||
          response.status === 403 ||
          data.code ===
            "LINE_NOT_BOUND" ||
          data.code ===
            "LINE_REQUIRED"
        ) {

          state.lineBound =
            false;

          updateLineUI();

          showLineGate();

          showToast(
            "請先連結 LINE 後才能下單"
          );

          return;

        }


        throw new Error(
          data.message ||
          data.error ||
          "訂單送出失敗"
        );

      }


      /*
       * 成功
       */

      const orderId =
        data.orderId ||
        data.orderNumber ||
        data.order_no ||
        data.id ||
        "";


      showOrderSuccess(
        orderId
      );


      /*
       * 清空購物車
       */

      state.items.forEach(
        item => {

          item.quantity =
            0;

        }
      );

      state.bag1Count =
        0;

      state.bag2Count =
        0;


      $("bag1Value")
        && (
          $("bag1Value")
            .textContent = "0"
        );

      $("bag2Value")
        && (
          $("bag2Value")
            .textContent = "0"
        );


      refreshMenu();

    } catch (
      error
    ) {

      console.error(
        "送出訂單失敗:",
        error
      );

      showToast(
        error.message ||
        "訂單送出失敗，請稍後再試"
      );

    } finally {

      state.submitting =
        false;

      updateSubmitButton();

      if (button) {

        button.textContent =
          "送出訂單";

      }

    }

  }


  /* =====================================================
     訂單成功

  function showOrderSuccess(

  ) {

    const text =
      $("successText");

    if (text) {

        text.innerHTML =

  /* =====================================================
     LINE Callback 後重新取得狀態
     ===================================================== */

  async function refreshLineAfterCallback() {

    try {

      await loadLineStatus();

      if (
        state.lineBound
      ) {

        await loadMenuFromServer();

      }

    } catch (
      error
    ) {

      );

    }

  /* =====================================================
     URL 狀態處理
     ===================================================== */

  function handleUrlState() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const lineStatus =
      params.get(
        "line"
      );

    const error =
      params.get(
        "error"
      );

    if (
      lineStatus === "success" ||
      lineStatus === "bound"
    ) {

      /*
       * LINE 綁定成功後，
       * server 通常會導回首頁。
       *
       * 重新查詢 server session，
       * 不直接相信 URL。
       */

      refreshLineAfterCallback();

    }


    if (
      error
    ) {

      let message =
        "LINE 連結失敗，請再試一次。";

      if (
        error ===
        "line_cancel"
      ) {

        message =
          "您取消了 LINE 連結。";

      } else if (
        error ===
        "line_login_failed"
      ) {

        message =
          "LINE 連結失敗，請稍後再試。";

      } else if (
        error ===
        "line_not_configured"
      ) {

        message =
          "LINE 尚未完成設定，請聯絡店家。";

      }

      showToast(
        message
      );

    }

  }


  /* =====================================================
     避免 URL 狀態重複觸發
     ===================================================== */

  function cleanUrlState() {

    const url =
      new URL(
        window.location.href
      );

    let changed =
      false;

    [
      "line",
      "error"
    ].forEach(
      key => {

        if (
          url.searchParams.has(
            key
          )
        ) {

          url.searchParams.delete(
            key
          );

          changed =
            true;

        }

      }
    );

    if (
      changed
    ) {

      window.history.replaceState(
        {},
        document.title,
        url.pathname +
        (
          url.searchParams.toString()
            ? "?" +
              url.searchParams.toString()
            : ""
        ) +
        url.hash
      );

    }

  }


  /* =====================================================
     初始化流程
     ===================================================== */

  async function initializePage() {

    /*
     * 一開始先隱藏真正點餐區。
     *
     * 客人尚未 LINE 綁定時：
     *
     * 首頁
     * ↓
     * 現在點餐
     * ↓
     * LINE Gate
     * ↓
     * LINE 登入
     * ↓
     * server 驗證
     * ↓
     * 才顯示點餐內容
     */

    showLineGate();

    updateLineUI();

    initPickupDate();

    initPickupTime();

    handleUrlState();

    /*
     * 先確認 LINE。
     */

    await loadLineStatus();

    /*
     * 只有 LINE 綁定成功，
     * 才載入真正點餐資料。
     */

    if (
      state.lineBound
    ) {

      await loadMenuFromServer();

      fillCustomerForm();

      updateSummary();

    }

    /*
     * 清除 callback query。
     */

    cleanUrlState();

  }


  /* =====================================================
     * 啟動
     * ===================================================== */

  initializePage();


  /* =====================================================
     * 防止未綁 LINE 直接顯示點餐區
     * ===================================================== */

  window.addEventListener(
    "pageshow",
    () => {

      if (
        !state.lineBound
      ) {

        showLineGate();

      }

    }
  );


  /* =====================================================
     * 頁面重新取得焦點時重新確認 LINE
     * ===================================================== */

  document.addEventListener(
    "visibilitychange",
    async () => {

      if (
        document.visibilityState !==
        "visible"
      ) {

        return;

      }

      /*
       * 不要在送單中干擾狀態。
       */

      if (
        state.submitting
      ) {

        return;

      }

      try {

        const response =
          await fetch(
            "/api/line/status",
            {
              method: "GET",

              credentials:
                "include",

              cache:
                "no-store"
            }
          );

        if (
          !response.ok
        ) {

          return;

        }

        const data =
          await response.json();

        const wasBound =
          state.lineBound;

        state.lineBound =
          Boolean(
            data.bound
          );

        state.lineUserId =
          data.lineUserId ||
          state.lineUserId ||
          "";

        state.lineDisplayName =
          data.displayName ||
          state.lineDisplayName ||
          "";

        updateLineUI();

        /*
         * 如果剛剛完成 LINE 綁定，
         * 自動進入點餐。
         */

        if (
          !wasBound &&
          state.lineBound
        ) {

          await loadLineCustomer();

          showOrderArea();

          await loadMenuFromServer();

          showToast(
            "LINE 已連結，可以開始點餐了"
          );

        }

        /*
         * 如果原本已綁定但現在失效，
         * 立即回到 LINE Gate。
         */

        if (
          wasBound &&
          !state.lineBound
        ) {

          showLineGate();

          showToast(
            "LINE 連結已失效，請重新連結"
          );

        }

      } catch (
        error
      ) {

        console.error(
          "重新確認 LINE 狀態失敗:",
          error
        );

      }

    }
  );

<script>
  /* =====================================================
     最後初始化確認
     ===================================================== */

  /*
   * 這裡不再重新建立任何 UI，
   * 避免與前面程式重複。
   */

  function finalPageCheck() {

    /*
     * 未綁定 LINE：
     * 絕對不能顯示真正點餐區。
     */

    if (
      !state.lineBound
    ) {

      showLineGate();

      return;

    }


    /*
     * 已綁定：
     * 顯示點餐區。
     */

    showOrderArea();

    fillCustomerForm();

    updateSummary();

  }


  /* =====================================================
     * 防止瀏覽器返回上一頁後繞過 LINE
     * ===================================================== */

  window.addEventListener(
    "popstate",
    async () => {

      try {

        const response =
          await fetch(
            "/api/line/status",
            {
              method: "GET",

              credentials:
                "include",

              cache:
                "no-store"
            }
          );

        if (
          !response.ok
        ) {

          state.lineBound =
            false;

          showLineGate();

          return;

        }

        const data =
          await response.json();

        state.lineBound =
          Boolean(
            data.bound
          );

        state.lineUserId =
          data.lineUserId ||
          "";

        state.lineDisplayName =
          data.displayName ||
          "";

        updateLineUI();

        if (
          state.lineBound
        ) {

          showOrderArea();

        } else {

          showLineGate();

        }

      } catch (
        error
      ) {

        console.error(
          "頁面狀態確認失敗:",
          error
        );

        state.lineBound =
          false;

        showLineGate();

      }

    }
  );


  /* =====================================================
     * 離開頁面前保存目前輸入
     * ===================================================== */

  function saveTemporaryOrder() {

    if (
      !state.lineBound
    ) {

      return;

    }

    readCustomerForm();

    const temporaryOrder = {

      customer:
        state.customer,

      pickupDate:
        $("pickupDate")?.value ||
        "",

      pickupTime:
        $("pickupTime")?.value ||
        "",

      items:
        state.items,

      bag1Count:
        state.bag1Count,

      bag2Count:
        state.bag2Count

    };

    try {

      sessionStorage.setItem(
        "orderDraft",
        JSON.stringify(
          temporaryOrder
        )
      );

    } catch (
      error
    ) {

      console.warn(
        "無法保存訂單草稿:",
        error
      );

    }

  }


  /* =====================================================
     * 還原訂單草稿
     * ===================================================== */

  function restoreTemporaryOrder() {

    try {

      const raw =
        sessionStorage.getItem(
          "orderDraft"
        );

      if (!raw) {

        return;

      }

      const draft =
        JSON.parse(
          raw
        );

      if (
        !draft ||
        typeof draft !==
          "object"
      ) {

        return;

      }


      if (
        draft.customer
      ) {

        state.customer =
          {
            ...state.customer,
            ...draft.customer
          };

      }


      if (
        draft.pickupDate &&
        $("pickupDate")
      ) {

        $("pickupDate")
          .value =
            draft.pickupDate;

      }


      if (
        draft.pickupTime &&
        $("pickupTime")
      ) {

        $("pickupTime")
          .value =
            draft.pickupTime;

      }


      if (
        Array.isArray(
          draft.items
        ) &&
        state.items.length
      ) {

        draft.items.forEach(
          savedItem => {

            const current =
              state.items.find(
                item =>
                  String(
                    item.id
                  ) ===
                  String(
                    savedItem.id
                  )
              );

            if (!current) {

              return;

            }

            current.quantity =
              Number(
                savedItem.quantity ||
                  0
              );

            current.sweetness =
              savedItem.sweetness ||
              current.sweetness ||
              "正常";

            current.ice =
              savedItem.ice ||
              current.ice ||
              "正常冰";

          }
        );

      }


      state.bag1Count =
        Number(
          draft.bag1Count || 0
        );

      state.bag2Count =
        Number(
          draft.bag2Count || 0
        );


      if (
        $("bag1Value")
      ) {

        $("bag1Value")
          .textContent =
            state.bag1Count;

      }


      if (
        $("bag2Value")
      ) {

        $("bag2Value")
          .textContent =
            state.bag2Count;

      }


      fillCustomerForm();

      refreshMenu();

    } catch (
      error
    ) {

      console.warn(
        "還原訂單草稿失敗:",
        error
      );

    }

  }


  /* =====================================================
     * 監聽輸入並保存草稿
     * ===================================================== */

  let draftSaveTimer =
    null;

  function scheduleDraftSave() {

    clearTimeout(
      draftSaveTimer
    );

    draftSaveTimer =
      setTimeout(
        () => {

          saveTemporaryOrder();

        },
        300
      );

  }


  [
    "customerName",
    "customerPhone",
    "invoiceNumber",
    "orderNote",
    "pickupDate",
    "pickupTime"
  ].forEach(
    id => {

      const element =
        $(id);

      if (!element) {

        return;

      }

      element.addEventListener(
        "input",
        scheduleDraftSave
      );

      element.addEventListener(
        "change",
        scheduleDraftSave
      );

    }
  );


  /* =====================================================
     * 商品變更後保存
     * ===================================================== */

  document.addEventListener(
    "click",
    event => {

      if (
        event.target.closest(
          ".item-plus"
        ) ||
        event.target.closest(
          ".item-minus"
        ) ||
        event.target.closest(
          "#bag1Plus"
        ) ||
        event.target.closest(
          "#bag1Minus"
        ) ||
        event.target.closest(
          "#bag2Plus"
        ) ||
        event.target.closest(
          "#bag2Minus"
        )
      ) {

        scheduleDraftSave();

      }

    }
  );


  document.addEventListener(
    "change",
    event => {

      if (
        event.target.closest(
          ".item-sweetness"
        ) ||
        event.target.closest(
          ".item-ice"
        )
      ) {

        scheduleDraftSave();

      }

    }
  );


  /* =====================================================
     * 成功送單後清除草稿
     * ===================================================== */

  function clearTemporaryOrder() {

    try {

      sessionStorage.removeItem(
        "orderDraft"
      );

    } catch (
      error
    ) {

      console.warn(
        "無法清除訂單草稿:",
        error
      );

    }

  }


  /*
   * 包裝原本的成功處理，
   * 成功後清除草稿。
   */

  const originalShowOrderSuccess =
    showOrderSuccess;

  showOrderSuccess =
    function(orderId) {

      clearTemporaryOrder();

      originalShowOrderSuccess(
        orderId
      );

    };


  /* =====================================================
     * 初始化後還原草稿
     * ===================================================== */

  const originalLoadMenuFromServer =
    loadMenuFromServer;

  loadMenuFromServer =
    async function() {

      await originalLoadMenuFromServer();

      if (
        state.lineBound
      ) {

        restoreTemporaryOrder();

      }

    };


  /* =====================================================
     * LINE callback 回來後
     * 確認登入狀態
     * ===================================================== */

  const originalRefreshLineAfterCallback =
    refreshLineAfterCallback;

  refreshLineAfterCallback =
    async function() {

      await originalRefreshLineAfterCallback();

      if (
        state.lineBound
      ) {

        await loadMenuFromServer();

        finalPageCheck();

      }

    };


  /* =====================================================
     * 再次確認送單條件
     * ===================================================== */

  function canSubmitOrder() {

    if (
      !state.lineBound
    ) {

      return false;

    }

    if (
      state.submitting
    ) {

      return false;

    }

    const items =
      getSelectedItems();

    if (
      !items.length
    ) {

      return false;

    }

    return true;

  }


  /* =====================================================
     * 最後一層送單按鈕保護
     * ===================================================== */

  $("submitOrderButton")
    ?.addEventListener(
      "click",
      event => {

        /*
         * 如果沒有 LINE，
         * 不讓任何訂單 API 執行。
         */

        if (
          !state.lineBound
        ) {

          event.preventDefault();
          event.stopPropagation();

          requireLineBinding();

          return;

        }

        /*
         * 其餘流程交給 submitOrder。
         */

      },
      true
    );


  /* =====================================================
     * LINE 狀態定期確認
     *
     * 每 60 秒確認一次。
     * 若 LINE session 失效，
     * 自動停止點餐。
     * ===================================================== */

  setInterval(
    async () => {

      if (
        document.hidden ||
        state.submitting
      ) {

        return;

      }

      try {

        const response =
          await fetch(
            "/api/line/status",
            {
              method: "GET",

              credentials:
                "include",

              cache:
                "no-store"
            }
          );

        if (
          !response.ok
        ) {

          return;

        }

        const data =
          await response.json();

        const currentlyBound =
          Boolean(
            data.bound
          );

        if (
          state.lineBound &&
          !currentlyBound
        ) {

          state.lineBound =
            false;

          state.lineUserId =
            "";

          state.lineDisplayName =
            "";

          updateLineUI();

          showLineGate();

          showToast(
            "LINE 連結已失效，請重新連結"
          );

          return;

        }

        if (
          !state.lineBound &&
          currentlyBound
        ) {

          state.lineBound =
            true;

          state.lineUserId =
            data.lineUserId ||
            "";

          state.lineDisplayName =
            data.displayName ||
            "";

          updateLineUI();

          await loadLineCustomer();

          showOrderArea();

          await loadMenuFromServer();

          showToast(
            "LINE 已連結，可以開始點餐"
          );

        }

      } catch (
        error
      ) {

        /*
         * 網路短暫錯誤不立即登出客人。
         * 避免客人只是網路不穩就被踢出去。
         */

        console.warn(
          "LINE 定期確認失敗:",
          error
        );

      }

    },
    60000
  );


  /* =====================================================
     * 頁面關閉前保存
     * ===================================================== */

  window.addEventListener(
    "beforeunload",
    () => {

      saveTemporaryOrder();

    }
  );


  /* =====================================================
     * 防止重複送單
     * ===================================================== */

  let lastSubmitAt =
    0;

  const originalSubmitOrder =
    submitOrder;

  submitOrder =
    async function() {

      const now =
        Date.now();

      /*
       * 1.5 秒內不接受第二次送單。
       */

      if (
        now - lastSubmitAt <
        1500
      ) {

        return;

      }

      lastSubmitAt =
        now;

      return originalSubmitOrder();

    };


  /* =====================================================
     * 最後更新按鈕
     * ===================================================== */

  updateSubmitButton();


  /* =====================================================
     * 完成
     * ===================================================== */

  console.log(
    "點茶點餐系統已初始化"
  );

</script>
